<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{general/fragmentos :: head}"></head>
<body>

<header th:replace="~{general/fragmentos :: header}"></header>

<main class="container my-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="fw-bold mb-0">Barberos</h1>
        <button type="button" class="btn btn-danger" data-bs-toggle="modal"
                data-bs-target="#barberoModal" data-modo="agregar">
            <i class="fa-solid fa-plus"></i> Agregar
        </button>
    </div>

    <div class="card">
        <div class="card-body">
            <table class="table table-striped table-hover align-middle" th:if="${!#lists.isEmpty(barberos)}">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Nombre</th>
                        <th>Descripción</th>
                        <th>Horario</th>
                        <th>Estado</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="b : ${barberos}">
                        <td th:text="${b.idBarbero}"></td>
                        <td th:text="${b.nombre}"></td>
                        <td th:text="${b.descripcion}"></td>
                        <td th:text="${b.horaInicio} + ' - ' + ${b.horaFin}"></td>
                        <td th:text="${b.activo} ? 'Activo' : 'Inactivo'"></td>
                        <td class="text-end">
                            <button type="button" class="btn btn-warning btn-sm" data-bs-toggle="modal"
                                    data-bs-target="#barberoModal" data-modo="editar"
                                    th:data-id="${b.idBarbero}" th:data-nombre="${b.nombre}"
                                    th:data-descripcion="${b.descripcion}"
                                    th:data-inicio="${b.horaInicio}" th:data-fin="${b.horaFin}"
                                    th:data-activo="${b.activo}">
                                <i class="fas fa-pencil-alt"></i> Actualizar
                            </button>
                            <button type="button" class="btn btn-danger btn-sm" data-bs-toggle="modal"
                                    data-bs-target="#confirmModal"
                                    th:data-bs-id="${b.idBarbero}" th:data-bs-descripcion="${b.nombre}">
                                <i class="fa-solid fa-trash"></i> Eliminar
                            </button>
                        </td>
                    </tr>
                </tbody>
            </table>
            <p class="text-center text-secondary mb-0" th:if="${#lists.isEmpty(barberos)}">
                No hay barberos registrados.
            </p>
        </div>
    </div>
</main>

<div class="modal fade" id="barberoModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <form method="post" th:action="@{/admin/barberos/guardar}">
                <div class="modal-header">
                    <h5 class="modal-title" id="barberoTitulo"></h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="barberoId" name="idBarbero"/>
                    <div class="mb-3">
                        <label for="barberoNombre" class="form-label">Nombre</label>
                        <input type="text" id="barberoNombre" name="nombre" class="form-control" maxlength="60" required/>
                    </div>
                    <div class="mb-3">
                        <label for="barberoDescripcion" class="form-label">Descripción</label>
                        <textarea id="barberoDescripcion" name="descripcion" class="form-control" rows="3" maxlength="255"></textarea>
                    </div>
                    <div class="row">
                        <div class="col-6 mb-3">
                            <label for="barberoInicio" class="form-label">Hora de inicio</label>
                            <input type="time" id="barberoInicio" name="horaInicio" class="form-control" required/>
                        </div>
                        <div class="col-6 mb-3">
                            <label for="barberoFin" class="form-label">Hora de fin</label>
                            <input type="time" id="barberoFin" name="horaFin" class="form-control" required/>
                        </div>
                    </div>
                    <div class="form-check">
                        <input type="hidden" name="_activo" value="on"/>
                        <input type="checkbox" id="barberoActivo" name="activo" class="form-check-input"/>
                        <label for="barberoActivo" class="form-check-label">Activo</label>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                        <i class="fa-solid fa-xmark"></i> Cerrar
                    </button>
                    <button type="submit" class="btn btn-success">
                        <i class="fa-solid fa-floppy-disk"></i> Guardar
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<section th:replace="~{general/fragmentos :: confirmarEliminar(@{/admin/barberos/eliminar},'idBarbero')}"></section>
<section th:replace="~{general/fragmentos :: mostrarToast}"></section>

<footer th:replace="~{general/fragmentos :: footer}"></footer>

<script>
document.addEventListener('DOMContentLoaded', function () {
    const modal = document.getElementById('barberoModal');
    const titulo = document.getElementById('barberoTitulo');
    const id = document.getElementById('barberoId');
    const nombre = document.getElementById('barberoNombre');
    const descripcion = document.getElementById('barberoDescripcion');
    const inicio = document.getElementById('barberoInicio');
    const fin = document.getElementById('barberoFin');
    const activo = document.getElementById('barberoActivo');

    modal.addEventListener('show.bs.modal', function (evento) {
        const boton = evento.relatedTarget;
        if (boton.dataset.modo === 'editar') {
            titulo.textContent = 'Actualizar barbero';
            id.value = boton.dataset.id;
            nombre.value = boton.dataset.nombre;
            descripcion.value = boton.dataset.descripcion || '';
            inicio.value = boton.dataset.inicio;
            fin.value = boton.dataset.fin;
            activo.checked = boton.dataset.activo === 'true';
        } else {
            titulo.textContent = 'Agregar barbero';
            id.value = '';
            nombre.value = '';
            descripcion.value = '';
            inicio.value = '09:00';
            fin.value = '18:00';
            activo.checked = true;
        }
    });

    const confirmar = document.getElementById('confirmModal');
    confirmar.addEventListener('show.bs.modal', function (evento) {
        const boton = evento.relatedTarget;
        document.getElementById('modalId').value = boton.dataset.bsId;
        document.getElementById('modalDescripcion').textContent = boton.dataset.bsDescripcion;
    });
});

setTimeout(function () {
    document.querySelectorAll('.toast').forEach(function (t) {
        t.classList.remove('show');
    });
}, 4000);
</script>
</body>
</html>
