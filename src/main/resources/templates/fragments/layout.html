<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<!-- HEAD reutilizable: se usa con th:replace y el título como parámetro -->
<head th:fragment="head(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${titulo} + ' | Quality and Style'">Quality and Style</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/styles.css}" rel="stylesheet">
</head>

<body>

<!-- NAVBAR -->
<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark bg-black sticky-top">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/}">
            <i class="bi bi-scissors me-2"></i>Quality and Style
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal"
                aria-controls="menuPrincipal" aria-expanded="false" aria-label="Mostrar menú">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="menuPrincipal">
            <ul class="navbar-nav mx-auto mb-2 mb-lg-0">
                <li class="nav-item"><a class="nav-link" th:href="@{/}">Inicio</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/#servicios}">Servicios</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/#nosotros}">Nosotros</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/#contacto}">Contacto</a></li>
            </ul>
            <a class="btn btn-danger" th:href="@{/reservar}">Reservar cita</a>
        </div>
    </div>
</nav>

<!-- FOOTER -->
<footer th:fragment="footer" id="contacto" class="bg-black text-light py-4 mt-5">
    <div class="container">
        <div class="row align-items-center gy-3">
            <div class="col-md-4">
                <span class="fw-bold fs-5">Quality and Style</span><br>
                <small class="text-secondary">Barber Shop</small>
            </div>
            <div class="col-md-4">
                <p class="mb-1"><i class="bi bi-telephone me-2"></i>+506 70923530</p>
                <p class="mb-0"><i class="bi bi-geo-alt me-2"></i>San José, Costa Rica</p>
            </div>
            <div class="col-md-4 text-md-end">
                <a href="#" class="text-light fs-4 me-3"><i class="bi bi-instagram"></i></a>
                <a href="#" class="text-light fs-4 me-3"><i class="bi bi-whatsapp"></i></a>
                <a href="#" class="text-light fs-4 me-3"><i class="bi bi-tiktok"></i></a>
                <a href="#" class="text-light fs-4"><i class="bi bi-facebook"></i></a>
            </div>
        </div>
        <hr class="border-secondary">
        <p class="text-center text-secondary small mb-0">Quality and Style · 2026</p>
    </div>
</footer>

<!-- SCRIPTS -->
<th:block th:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</th:block>

</body>
</html>
