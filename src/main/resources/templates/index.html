<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{general/fragmentos :: head}"></head>
<body>

<header th:replace="~{general/fragmentos :: header}"></header>
<div th:if="${exito}" class="alert alert-success text-center m-0 rounded-0" th:text="${exito}"></div>

<section class="hero d-flex align-items-center py-5">
    <div class="container">
        <small class="text-uppercase text-white-50">— Quality and Style —</small>
        <h1 class="display-5 fw-bold text-white mb-4">TU ESTILO,<br>NUESTRA EXPERIENCIA</h1>
        <a class="btn btn-danger px-4" th:href="@{/reservar}">Reservar cita</a>
    </div>
</section>

<section id="servicios" class="bg-body-secondary py-5">
    <div class="container text-center">
        <small class="text-uppercase text-secondary">— Nuestros —</small>
        <h2 class="fw-bold mb-4">SERVICIOS</h2>

        <p th:if="${#lists.isEmpty(servicios)}" class="text-secondary">
            Por el momento no hay servicios disponibles.
        </p>

        <div class="servicios-grid">
            <div th:each="s : ${servicios}" th:with="n=${#strings.toLowerCase(s.nombre)}">
                <div class="card servicio-card bg-black text-white h-100">
                    <div class="card-body d-flex flex-column justify-content-center align-items-center text-center">
                        <i class="fa-solid servicio-icono mb-3"
                           th:classappend="${n.contains('corte') ? 'fa-scissors' : (n.contains('barba') ? 'fa-user-tie' : (n.contains('ceja') ? 'fa-eye' : 'fa-star'))}"></i>
                        <h5 class="card-title text-uppercase" th:text="${s.nombre}">Servicio</h5>
                        <p class="fw-semibold mb-3"
                           th:text="'₡' + ${#numbers.formatDecimal(s.precio, 1, 'POINT', 0, 'COMMA')}">₡0</p>
                        <a class="btn btn-outline-light btn-sm w-100"
                           th:href="@{/reservar(servicioId=${s.idServicio})}">Reservar</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>

<footer th:replace="~{general/fragmentos :: footer}"></footer>

</body>
</html>
