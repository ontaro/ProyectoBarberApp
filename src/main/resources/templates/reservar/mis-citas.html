<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{general/fragmentos :: head}"></head>

<body>

<header th:replace="~{general/fragmentos :: header}"></header>

<main class="container my-5">

    <h2 class="fw-bold text-center mb-2">Mis próximas citas</h2>

    <p class="text-center text-secondary mb-4">
        Consulta tus próximas reservas en BarberApp.
    </p>

    <!-- Mensaje cuando no existen citas -->
    <div th:if="${#lists.isEmpty(citas)}"
         class="alert alert-info text-center">
        No tienes citas próximas registradas.
    </div>

    <!-- Tabla de citas -->
    <div th:unless="${#lists.isEmpty(citas)}"
         class="table-responsive">

        <table class="table table-striped table-hover text-center align-middle">

            <thead class="table-dark">
                <tr>
                    <th>Servicio</th>
                    <th>Barbero</th>
                    <th>Fecha</th>
                    <th>Hora</th>
                    <th>Estado</th>
                </tr>
            </thead>

            <tbody>
                <tr th:each="cita : ${citas}">

                    <td th:text="${cita.servicio.nombre}"></td>

                    <td th:text="${cita.barbero.nombre}"></td>

                    <td th:text="${#temporals.format(cita.fecha, 'dd/MM/yyyy')}"></td>

                    <td th:text="${#temporals.format(cita.hora, 'HH:mm')}"></td>

                    <td>
                        <span class="badge bg-success"
                              th:text="${cita.estado}">
                        </span>
                    </td>

                </tr>
            </tbody>

        </table>
    </div>

    <div class="text-center mt-4">
        <a th:href="@{/}" class="btn btn-outline-secondary px-4">
            Volver al inicio
        </a>
    </div>

</main>

<footer th:replace="~{general/fragmentos :: footer}"></footer>

</body>
</html>
